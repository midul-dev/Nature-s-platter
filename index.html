<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Nature's Platter</title>
    <!-- Tailwind cdn  -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <!-- fontawosome cds  -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css"
      integrity="sha512-QeR2VH+lsBE5LSAe1Q5EnTBbe7XTBubt8dG93Y7gidSgdMCr8nVqKcfKAMyN96SV8KDbZVTDXChatu5G2KQGzg=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
  </head>
  <body>
    <header class="bg-linear-to-l from[#FFFFFF] to-[#EFEBE3] ">
      <nav class="relative flex justify-between container mx-auto items-center pt-4">
        <img
          src="./assets/nav-logo.png"
          alt="Nature's Platter Logo"
          class="h-auto w-27.5"
        />
        <ul class="mx-auto flex gap-5 items-center justify-center">
          <li>Product</li>
          <li>Services</li>
          <li>Contact Us</li>
        </ul>
        <div class="flex gap-2 items-center">
          <span class="pr-1"><i class="fa-solid fa-magnifying-glass"></i></span>
          <span class="pr-2"><i class="fa-solid fa-cart-plus"></i></span>
          <button class="border py-0.5 px-4 rounded-sm border-[#179800]">
            Login
          </button>
          <button class="py-0.5 px-4 rounded-sm bg-[#179800] text-white">
            Register
          </button>
        </div>
      </nav>


      <!-- hero -->
      <section class="mt-10">
          <div class="w-[30%] mx-auto text-center space-y-3">
            <h1 class=" text-3xl font-semibold">Freshness <span class="text-[#179800]">You Can <br>Count On</span>, Prices You’ll Love!</h1>
            <p class="text-[10px] text-[#111111]">
                Shop your daily essentials at unbeatable prices. From fresh produce to
                pantry staples, we’ve got you covered every day!
            </p>
        </div>
        <img src="./assets/Hero Section-large.png" alt="" class="mx-auto"/>
      </section>
    </header>
  </body>
</html>
